<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saluran GB • Animasi Keren</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: radial-gradient(circle at 20% 30%, #0b0f1c, #03050b);
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    #bg-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .hero {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 1200px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .glass-card {
      background: rgba(20, 30, 50, 0.25);
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border-radius: 48px;
      padding: 3rem 2.5rem;
      border: 1px solid rgba(100, 200, 255, 0.2);
      box-shadow: 0 30px 50px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(0, 255, 255, 0.1) inset;
      animation: floatGlow 6s ease-in-out infinite, borderPulse 4s infinite alternate;
      transition: transform 0.3s ease;
      max-width: 820px;
      width: 100%;
    }

    .glass-card:hover {
      transform: scale(1.01);
      box-shadow: 0 40px 70px rgba(0, 200, 255, 0.3), 0 0 0 2px rgba(0, 255, 255, 0.3) inset;
    }

    @keyframes floatGlow {
      0% { transform: translateY(0px); box-shadow: 0 30px 50px rgba(0,0,0,0.7), 0 0 0 1px rgba(0,255,255,0.1) inset; }
      50% { transform: translateY(-15px); box-shadow: 0 50px 70px rgba(0,180,255,0.25), 0 0 0 2px rgba(0,255,255,0.25) inset; }
      100% { transform: translateY(0px); box-shadow: 0 30px 50px rgba(0,0,0,0.7), 0 0 0 1px rgba(0,255,255,0.1) inset; }
    }

    @keyframes borderPulse {
      0% { border-color: rgba(100, 200, 255, 0.2); }
      100% { border-color: rgba(0, 255, 200, 0.6); }
    }

    .glow-title {
      font-size: clamp(2.2rem, 7vw, 4rem);
      font-weight: 900;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #a0f0ff, #80d0ff, #c0a0ff, #a0f0ff);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 20px rgba(0, 200, 255, 0.7), 0 0 40px rgba(100, 0, 255, 0.4);
      animation: textShine 6s infinite alternate, neonPulse 2s infinite alternate;
    }

    @keyframes textShine {
      0% { background-position: 0% 50%; }
      100% { background-position: 100% 50%; }
    }

    @keyframes neonPulse {
      0% { text-shadow: 0 0 15px #00aaff, 0 0 30px #0066ff, 0 0 45px #5500ff; }
      100% { text-shadow: 0 0 25px #00ffff, 0 0 50px #0088ff, 0 0 70px #aa00ff; }
    }

    .subtitle {
      font-size: 1.25rem;
      color: #c0e0ff;
      margin-bottom: 2rem;
      letter-spacing: 2px;
      font-weight: 300;
      text-shadow: 0 0 15px rgba(0, 200, 255, 0.5);
      animation: softFade 3s infinite alternate;
    }

    @keyframes softFade {
      0% { opacity: 0.7; letter-spacing: 2px; }
      100% { opacity: 1; letter-spacing: 3px; }
    }

    /* Kartu saluran */
    .channel-card {
      background: rgba(10, 20, 40, 0.45);
      border: 1px solid rgba(0, 255, 255, 0.25);
      border-radius: 28px;
      padding: 1.4rem 1.6rem;
      margin-bottom: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      align-items: stretch;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 15px rgba(0, 200, 255, 0.15) inset;
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    .channel-card:hover {
      border-color: rgba(0, 255, 255, 0.6);
      box-shadow: 0 15px 40px rgba(0, 150, 255, 0.25), 0 0 20px rgba(0, 255, 255, 0.25) inset;
    }

    .channel-card.sultan {
      border-color: rgba(255, 0, 200, 0.3);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 15px rgba(255, 0, 200, 0.15) inset;
    }
    .channel-card.sultan:hover {
      border-color: rgba(255, 0, 200, 0.7);
      box-shadow: 0 15px 40px rgba(255, 0, 150, 0.3), 0 0 20px rgba(255, 0, 255, 0.3) inset;
    }

    .channel-header {
      display: flex;
      align-items: center;
      gap: 0.9rem;
      text-align: left;
    }

    .channel-icon {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      flex-shrink: 0;
      background: linear-gradient(145deg, #0f2a4a, #05101f);
      border: 1px solid rgba(0, 255, 255, 0.5);
      box-shadow: 0 0 20px rgba(0, 200, 255, 0.4);
      color: #7fe7ff;
      animation: iconPulse 2.5s infinite alternate;
    }

    .channel-card.sultan .channel-icon {
      background: linear-gradient(145deg, #2a0f3a, #1a0525);
      border-color: rgba(255, 0, 200, 0.6);
      box-shadow: 0 0 20px rgba(255, 0, 200, 0.4);
      color: #ff9df0;
    }

    @keyframes iconPulse {
      0% { box-shadow: 0 0 15px rgba(0,200,255,0.3); }
      100% { box-shadow: 0 0 30px rgba(0,255,255,0.7); }
    }

    .channel-info {
      flex: 1;
      min-width: 0;
    }

    .channel-name {
      font-size: 1.15rem;
      font-weight: 700;
      color: #e0f4ff;
      letter-spacing: 1px;
      margin-bottom: 0.25rem;
      text-shadow: 0 0 12px rgba(0, 200, 255, 0.5);
    }

    .channel-card.sultan .channel-name {
      color: #ffe0fa;
      text-shadow: 0 0 12px rgba(255, 0, 200, 0.5);
    }

    .channel-link {
      font-size: 0.8rem;
      color: #7fa8c8;
      word-break: break-all;
      line-height: 1.3;
      font-family: ui-monospace, monospace;
    }

    /* Tombol aksi */
    .channel-actions {
      display: flex;
      gap: 0.7rem;
      flex-wrap: wrap;
    }

    .btn-action {
      flex: 1;
      min-width: 130px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0.85rem 1rem;
      font-size: 0.95rem;
      font-weight: 700;
      border-radius: 50px;
      text-decoration: none;
      color: #fff;
      cursor: pointer;
      border: 1px solid rgba(0, 255, 255, 0.5);
      background: linear-gradient(145deg, #0f2a4a, #05101f);
      box-shadow: 0 6px 18px rgba(0,0,0,0.5), 0 0 12px rgba(0, 200, 255, 0.25);
      transition: all 0.3s ease;
      letter-spacing: 0.5px;
      position: relative;
      overflow: hidden;
      font-family: inherit;
    }

    .btn-action i { font-size: 1.1rem; }

    .btn-action:hover {
      border-color: #00ffff;
      box-shadow: 0 0 25px rgba(0, 200, 255, 0.6);
      transform: translateY(-3px);
    }

    .btn-action:active { transform: translateY(0); }

    .btn-action.join {
      background: linear-gradient(145deg, #0c5f7a, #073b4d);
    }

    .btn-action.copy {
      background: linear-gradient(145deg, #1e3a5f, #0c1c30);
    }

    .btn-action.copy.copied {
      background: linear-gradient(145deg, #0f7a3a, #064a1e);
      border-color: #00ff88;
      box-shadow: 0 0 25px rgba(0, 255, 120, 0.6);
    }

    .channel-card.sultan .btn-action {
      border-color: rgba(255, 0, 200, 0.5);
      box-shadow: 0 6px 18px rgba(0,0,0,0.5), 0 0 12px rgba(255, 0, 200, 0.25);
    }
    .channel-card.sultan .btn-action:hover {
      border-color: #ff00cc;
      box-shadow: 0 0 25px rgba(255, 0, 200, 0.6);
    }
    .channel-card.sultan .btn-action.join {
      background: linear-gradient(145deg, #7a0c5f, #4d073b);
    }
    .channel-card.sultan .btn-action.copy {
      background: linear-gradient(145deg, #5f1e3a, #300c1c);
    }

    .footer-note {
      margin-top: 1.5rem;
      font-size: 0.85rem;
      color: #8aa0c0;
      letter-spacing: 2px;
      opacity: 0.8;
      animation: softFade 4s infinite alternate;
      text-transform: uppercase;
      font-weight: 300;
    }

    /* Toast notifikasi */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(0, 255, 200, 0.15);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 255, 200, 0.6);
      color: #d0fff0;
      padding: 0.9rem 2rem;
      border-radius: 50px;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 1px;
      box-shadow: 0 0 30px rgba(0, 255, 200, 0.4);
      z-index: 999;
      opacity: 0;
      transition: all 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55);
      display: flex;
      align-items: center;
      gap: 10px;
      pointer-events: none;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .toast i { font-size: 1.2rem; color: #00ffcc; }

    @media (max-width: 600px) {
      .glass-card { padding: 2rem 1.2rem; border-radius: 32px; }
      .channel-card { padding: 1.1rem 1rem; }
      .channel-icon { width: 44px; height: 44px; font-size: 1.3rem; }
      .channel-name { font-size: 1rem; }
      .btn-action { padding: 0.75rem 0.8rem; font-size: 0.85rem; }
      .subtitle { font-size: 1rem; }
      .toast { font-size: 0.8rem; padding: 0.7rem 1.4rem; }
    }
  </style>
</head>
<body>

  <canvas id="bg-canvas"></canvas>

  <div class="hero">
    <div class="glass-card">
      <h1 class="glow-title">Saluran GB</h1>
      <p class="subtitle">Klik & Bergabung</p>

      <!-- Kartu Saluran GB -->
      <div class="channel-card">
        <div class="channel-header">
          <div class="channel-icon"><i class="fab fa-whatsapp"></i></div>
          <div class="channel-info">
            <div class="channel-name">Saluran GB</div>
            <div class="channel-link" id="linkGB">https://whatsapp.com/channel/0029Vb9SeeXATRSebg0m6d3Q</div>
          </div>
        </div>
        <div class="channel-actions">
          <a href="https://whatsapp.com/channel/0029Vb9SeeXATRSebg0m6d3Q" target="_blank" rel="noopener noreferrer" class="btn-action join">
            <i class="fab fa-whatsapp"></i> Gabung
          </a>
          <button class="btn-action copy" data-copy="https://whatsapp.com/channel/0029Vb9SeeXATRSebg0m6d3Q" data-label="Link Saluran GB">
            <i class="fas fa-copy"></i> Salin Link
          </button>
        </div>
      </div>

      <!-- Kartu Script by Sultan -->
      <div class="channel-card sultan">
        <div class="channel-header">
          <div class="channel-icon"><i class="fas fa-crown"></i></div>
          <div class="channel-info">
            <div class="channel-name">Script by Sultan</div>
            <div class="channel-link">https://whatsapp.com/channel/0029Vb9dAvWLikgHj7xbu70x</div>
          </div>
        </div>
        <div class="channel-actions">
          <a href="https://whatsapp.com/channel/0029Vb9dAvWLikgHj7xbu70x" target="_blank" rel="noopener noreferrer" class="btn-action join">
            <i class="fab fa-whatsapp"></i> Gabung
          </a>
          <button class="btn-action copy" data-copy="https://whatsapp.com/channel/0029Vb9dAvWLikgHj7xbu70x" data-label="Link Script by Sultan">
            <i class="fas fa-copy"></i> Salin Link
          </button>
        </div>
      </div>

      <div class="footer-note">✦ animasi bergerak · keren · futuristik ✦</div>
    </div>
  </div>

  <!-- Toast Notifikasi -->
  <div class="toast" id="toast">
    <i class="fas fa-check-circle"></i>
    <span id="toastText">Link berhasil disalin!</span>
  </div>

  <script>
    (function() {
      /* ========== PARTIKEL ANIMASI ========== */
      const canvas = document.getElementById('bg-canvas');
      const ctx = canvas.getContext('2d');
      let width, height;
      let particles = [];
      let mouseX = 0, mouseY = 0;
      let isMouseMoving = false;

      const PARTICLE_COUNT = 120;
      const MAX_SPEED = 0.8;

      function resizeCanvas() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
        initParticles();
      }

      class Particle {
        constructor() { this.reset(); }
        reset() {
          this.x = Math.random() * width;
          this.y = Math.random() * height;
          this.vx = (Math.random() - 0.5) * MAX_SPEED;
          this.vy = (Math.random() - 0.5) * MAX_SPEED;
          this.radius = Math.random() * 3 + 1.5;
          const hue = Math.random() * 60 + 180;
          const sat = Math.random() * 30 + 70;
          const light = Math.random() * 30 + 60;
          this.color = `hsla(${hue}, ${sat}%, ${light}%, ${Math.random() * 0.5 + 0.3})`;
          this.glow = Math.random() * 8 + 4;
        }
        update() {
          this.x += this.vx;
          this.y += this.vy;
          if (this.x < 0) { this.x = 0; this.vx *= -0.98; }
          if (this.x > width) { this.x = width; this.vx *= -0.98; }
          if (this.y < 0) { this.y = 0; this.vy *= -0.98; }
          if (this.y > height) { this.y = height; this.vy *= -0.98; }

          if (isMouseMoving) {
            const dx = this.x - mouseX;
            const dy = this.y - mouseY;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const maxDist = 150;
            if (dist < maxDist) {
              const force = (maxDist - dist) / maxDist;
              const angle = Math.atan2(dy, dx);
              this.vx += Math.cos(angle) * force * 0.6;
              this.vy += Math.sin(angle) * force * 0.6;
            }
          }

          const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
          if (speed > MAX_SPEED * 1.8) {
            this.vx = (this.vx / speed) * MAX_SPEED * 1.8;
            this.vy = (this.vy / speed) * MAX_SPEED * 1.8;
          }
          this.vx *= 0.999;
          this.vy *= 0.999;
          if (Math.abs(this.vx) < 0.05) this.vx += (Math.random() - 0.5) * 0.1;
          if (Math.abs(this.vy) < 0.05) this.vy += (Math.random() - 0.5) * 0.1;
        }
        draw() {
          ctx.beginPath();
          ctx.shadowColor = this.color;
          ctx.shadowBlur = this.glow;
          ctx.fillStyle = this.color;
          ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
          ctx.fill();
          ctx.shadowBlur = 0;
        }
      }

      function initParticles() {
        particles = [];
        for (let i = 0; i < PARTICLE_COUNT; i++) particles.push(new Particle());
      }

      function animate() {
        ctx.clearRect(0, 0, width, height);
        const gradient = ctx.createRadialGradient(width * 0.5, height * 0.3, 0, width * 0.5, height * 0.5, width * 0.8);
        gradient.addColorStop(0, '#0a1020');
        gradient.addColorStop(0.7, '#03060c');
        gradient.addColorStop(1, '#010103');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, width, height);

        particles.forEach(p => { p.update(); p.draw(); });

        ctx.shadowBlur = 0;
        for (let i = 0; i < particles.length; i++) {
          for (let j = i + 1; j < particles.length; j++) {
            const dx = particles[i].x - particles[j].x;
            const dy = particles[i].y - particles[j].y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 100) {
              const opacity = (1 - dist / 100) * 0.25;
              ctx.beginPath();
              ctx.strokeStyle = `rgba(100, 200, 255, ${opacity})`;
              ctx.lineWidth = 0.8;
              ctx.moveTo(particles[i].x, particles[i].y);
              ctx.lineTo(particles[j].x, particles[j].y);
              ctx.stroke();
            }
          }
        }
        requestAnimationFrame(animate);
      }

      window.addEventListener('mousemove', (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;
        isMouseMoving = true;
        clearTimeout(window.mouseTimer);
        window.mouseTimer = setTimeout(() => { isMouseMoving = false; }, 200);
      });
      window.addEventListener('mouseleave', () => { isMouseMoving = false; });
      window.addEventListener('touchmove', (e) => {
        if (e.touches.length) {
          mouseX = e.touches[0].clientX;
          mouseY = e.touches[0].clientY;
          isMouseMoving = true;
          clearTimeout(window.touchTimer);
          window.touchTimer = setTimeout(() => { isMouseMoving = false; }, 200);
        }
      }, { passive: true });
      window.addEventListener('touchend', () => { isMouseMoving = false; });

      window.addEventListener('resize', resizeCanvas);
      resizeCanvas();
      animate();

      /* ========== FITUR SALIN LINK ========== */
      const toast = document.getElementById('toast');
      const toastText = document.getElementById('toastText');
      let toastTimer = null;

      function showToast(message) {
        toastText.textContent = message;
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          toast.classList.remove('show');
        }, 2200);
      }

      // Fungsi copy universal (fallback untuk browser lama)
      function copyToClipboard(text) {
        if (navigator.clipboard && window.isSecureContext) {
          return navigator.clipboard.writeText(text);
        }
        // Fallback
        return new Promise((resolve, reject) => {
          const textarea = document.createElement('textarea');
          textarea.value = text;
          textarea.style.position = 'fixed';
          textarea.style.opacity = '0';
          textarea.style.top = '0';
          textarea.style.left = '0';
          document.body.appendChild(textarea);
          textarea.focus();
          textarea.select();
          try {
            const successful = document.execCommand('copy');
            document.body.removeChild(textarea);
            successful ? resolve() : reject(new Error('Copy gagal'));
          } catch (err) {
            document.body.removeChild(textarea);
            reject(err);
          }
        });
      }

      // Pasang event listener ke semua tombol copy
      document.querySelectorAll('.btn-action.copy').forEach(btn => {
        btn.addEventListener('click', async function(e) {
          e.preventDefault();
          const link = this.getAttribute('data-copy');
          const label = this.getAttribute('data-label') || 'Link';
          const originalHTML = this.innerHTML;

          try {
            await copyToClipboard(link);
            // Berhasil
            this.classList.add('copied');
            this.innerHTML = '<i class="fas fa-check"></i> Tersalin!';
            showToast(label + ' berhasil disalin!');

            setTimeout(() => {
              this.classList.remove('copied');
              this.innerHTML = originalHTML;
            }, 2000);
          } catch (err) {
            // Fallback manual: select text
            showToast('Gagal menyalin. Salin manual: ' + link);
            // Coba select teks link di kartu
            const card = this.closest('.channel-card');
            if (card) {
              const linkEl = card.querySelector('.channel-link');
              if (linkEl) {
                const range = document.createRange();
                range.selectNodeContents(linkEl);
                const sel = window.getSelection();
                sel.removeAllRanges();
                sel.addRange(range);
              }
            }
          }
        });
      });
    })();
  </script>
</body>
</html>
